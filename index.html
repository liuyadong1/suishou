<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1112">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>随手大师</title>
<style>
/* Layout: one-screen camera — header, viewfinder fills the middle, hint cards float on the frame, controls at the thumb. Single dark look by choice (viewfinder). */
:root{
  --bg:#0D1112; --panel:#171D1F; --line:#2B3437; --fg:#EEF2F1; --muted:#95A29F; --black:#050707;
  --target:#4FD6B8; --now:#F3A443; --warn:#F07A6A; --ok:#7BD88F;
  --glass:rgba(8,12,13,.78);
  --display:"Barlow Condensed","DIN Alternate","Arial Narrow",sans-serif;
  --body:"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--target);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;letter-spacing:.04em;white-space:nowrap}
.brand small{color:var(--muted);font-weight:400;font-size:12px;letter-spacing:0;margin-left:6px}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 12px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--black);overflow:hidden}
#view{max-width:100%;max-height:100%;display:block}
.score{position:absolute;top:12px;left:12px;background:var(--glass);border-radius:12px;padding:4px 12px 6px;display:flex;align-items:baseline;gap:6px}
.score b{font-family:var(--display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.score span{font-size:12px;color:var(--muted)}
.flip{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;border:0;background:var(--glass);color:var(--fg);border-radius:999px;padding:7px 12px 7px 10px;font-size:13px}
.flip svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.flip[aria-pressed="true"]{background:var(--target);color:var(--bg)}
.flip[aria-pressed="true"] svg{stroke:var(--bg)}
.nighttools{position:absolute;top:58px;left:12px;display:grid;gap:6px;justify-items:start}
.pill-btn{border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px}
.pill-btn[aria-pressed="true"]{border-color:var(--target);color:var(--target)}
.nightov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:rgba(0,0,0,.45);text-align:center;padding:24px}
.nightov strong{font-size:18px}
.nightbar{width:min(70vw,260px);height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.nightbar span{display:block;height:100%;width:0;background:var(--target);transition:width .2s}
.tag{position:absolute;top:58px;right:12px;font-size:12px;background:var(--glass);padding:5px 10px;border-radius:999px;color:var(--muted)}
.hints{position:absolute;left:12px;right:12px;bottom:12px;display:grid;gap:8px}
.hint{background:var(--glass);border-radius:14px;padding:10px 12px 10px 10px;display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:12px;row-gap:2px;align-items:center}
.hint .pic{grid-row:span 2;width:52px;height:52px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.hint .pic svg{width:44px;height:44px}
.hint strong{font-size:15px;font-weight:600;align-self:end}
.hint p{align-self:start}
.hint p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.scenebar{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.scenebar::-webkit-scrollbar{display:none}
.scene-chip{padding:6px 12px;position:relative}
.scene-chip .rec{font-size:10px;color:var(--target);margin-left:4px}
.posebar{display:flex;align-items:center;gap:8px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.posebar::-webkit-scrollbar{display:none}
.posebar label{flex:0 0 auto;font-size:12px;color:var(--muted)}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;color:var(--muted)}
.chip svg{width:18px;height:28px}
.chip[aria-pressed="true"]{border-color:var(--target);color:var(--fg)}
.chip[aria-pressed="true"] svg{color:var(--target)}
.status{font-size:12px;color:var(--muted);text-align:center;padding:6px 16px 0;min-height:18px}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:10px calc(16px + env(safe-area-inset-bottom,0px));padding-inline:24px}
.side{justify-self:center;display:grid;justify-items:center;gap:4px;border:0;background:transparent;color:var(--muted);font-size:12px}
.side span.ic{width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.side svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side[aria-pressed="true"] span.ic{background:var(--target)}
.side[aria-pressed="true"] svg{stroke:var(--bg)}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid var(--fg);background:transparent;padding:4px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--fg);transition:transform .12s}
.shutter:active span{transform:scale(.9)}
.confirm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;padding-inline:16px;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
.confirm-box{width:min(100%,480px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:8px}
.confirm-box strong{font-size:17px}
.confirm-box p{margin:0 0 8px;color:var(--muted);font-size:14px;line-height:1.6}
.confirm-actions{display:grid;gap:8px}
.confirm-actions .btn{width:100%}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);width:min(92vw,480px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;z-index:20}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(28px + env(safe-area-inset-bottom,0px));padding-inline:16px}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:16px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:18px}
.sheet h3{margin:4px 0 0;font-size:15px}
.sheet p.note{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.sheet canvas,.sheet img{width:100%;height:auto;border-radius:12px;display:block}
.res-score{display:flex;align-items:baseline;gap:8px}
.res-score b{font-family:var(--display);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.res-score span{color:var(--muted)}
.list{display:grid;gap:8px}
.list .hint{background:var(--panel)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0;display:grid;gap:6px}
.compare figcaption{font-size:12px;color:var(--muted);text-align:center}
.compare figcaption b{font-family:var(--display);font-size:18px;color:var(--fg);margin-left:4px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.hint-wrap{display:grid;gap:6px}
.fb{display:flex;gap:8px;justify-content:flex-end}
.fbb{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 14px;font-size:12px}
.fbb[aria-pressed="true"]{border-color:var(--target);color:var(--fg)}
.dbg{background:var(--panel);border-radius:12px;padding:12px 14px}
.dbg summary{cursor:pointer;color:var(--muted);font-size:13px}
.dbg[open]{display:grid;gap:10px}
.dbg ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:13px;line-height:1.5}
.dbg ol span{color:var(--muted)}
.dbg a.btn{text-decoration:none;text-align:center}
.feat{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:2px 10px;font-size:11px;font-family:ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
@media (prefers-reduced-motion:reduce){.shutter span{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">随手大师<small>拍照教练 v0.6</small></div>
    <div class="seg" role="group" aria-label="拍摄模式">
      <button id="m-auto" data-mode="auto" aria-pressed="true">自动</button>
      <button id="m-scene" data-mode="scene" aria-pressed="false">风景</button>
      <button id="m-portrait" data-mode="portrait" aria-pressed="false">人像</button>
    </div>
  </header>

  <div class="scenebar" id="scenebar" role="group" aria-label="细分场景"></div>

  <main class="stage" id="stage">
    <canvas id="view" width="900" height="1200" aria-label="取景画面与构图提示"></canvas>
    <div class="score"><b id="scoreVal">--</b><span>构图分</span></div>
    <div class="tag" id="tag">示例画面</div>
    <div class="nighttools" id="nightTools" hidden>
      <button class="pill-btn" id="btnNight" aria-pressed="true">夜景合成：开</button>
      <button class="pill-btn" id="btnSys">系统相机拍</button>
    </div>
    <div class="nightov" id="nightOv" hidden role="status" aria-live="polite"><strong id="nightText">保持不动</strong><div class="nightbar"><span id="nightBar"></span></div></div>
    <button class="flip" id="btnFlip" aria-pressed="false" aria-label="切换前后摄像头"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 12.5a3 3 0 0 1 5.2-2"/><path d="M15 11.5a3 3 0 0 1-5.2 2"/><path d="M14.2 8.6v1.9h-1.9"/><path d="M9.8 15.4v-1.9h1.9"/></svg><span id="flipLabel">后置</span></button>
    <div class="hints" id="hints" aria-live="polite"></div>
  </main>

  <div class="posebar" id="posebar"><label>姿势模板</label></div>
  <div class="status" id="status">姿势识别加载中…</div>

  <footer class="controls">
    <button class="side" id="btnAlbum" aria-label="从相册选择照片"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></span>相册</button>
    <button class="shutter" id="btnShutter" aria-label="拍照"><span></span></button>
    <button class="side" id="btnLive" aria-pressed="false" aria-label="实时取景"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></span>实时取景</button>
  </footer>

  <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileAlbum" accept="image/*" hidden>
</div>

<section class="sheet" id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-top"><h2>拍照点评</h2><button class="btn ghost" id="closeSheet">返回取景</button></div>
    <div id="resBody" class="sheet-in"></div>
  </div>
</section>
<div class="confirm" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="cfTitle">
  <div class="confirm-box">
    <strong id="cfTitle">这张照片还没保存到相册</strong>
    <p>离开后就找不回来了，要先保存吗？</p>
    <div class="confirm-actions">
      <button class="btn" id="cfSave">保存并离开</button>
      <button class="btn ghost" id="cfDiscard">不保存，直接离开</button>
      <button class="btn ghost" id="cfCancel">留在这里</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import {compileRules, runRules} from './engine.js';
const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const css = getComputedStyle(document.documentElement);
const C = { target: css.getPropertyValue('--target').trim(), now: css.getPropertyValue('--now').trim(), warn: css.getPropertyValue('--warn').trim() };
const FONT = '"PingFang SC","MiSans","Noto Sans SC",sans-serif';
const S = { mode:'auto', pose:'none', live:false, human:null, video:null, stream:null, sensor:null, busy:false, lastRun:0, lastF:null, lastE:null, shown:[], active:new Map(), still:null, isSample:true, prev:null, sheetOpen:false, scoreS:null, facing:'environment', sub:'vista', subManual:false, rec:'vista', recCand:null, recSince:0, shake:null, pitch:null, nightOn:true, nightBusy:false, expComp:null };
const SUBS = {
  vista:{kind:'scene', name:'山海远景'}, city:{kind:'scene', name:'城市建筑'}, sunset:{kind:'scene', name:'日出日落'}, night:{kind:'scene', name:'夜景灯光'}, macro:{kind:'scene', name:'花草特写'},
  full:{kind:'portrait', name:'全身照'}, half:{kind:'portrait', name:'半身照'}, travel:{kind:'portrait', name:'人景打卡'}, sit:{kind:'portrait', name:'坐姿'}, selfie:{kind:'portrait', name:'自拍'},
};
const SUB_ORDER = { scene:['vista','city','sunset','night','macro'], portrait:['full','half','travel','sit','selfie'] };
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const mid = (a,b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);

/* ---------- pose templates (body units: hip centre = 0,0; torso length = 1; x = image left/right) ---------- */
const T0 = {nose:[0,-1.45], ls:[-0.4,-1], rs:[0.4,-1], le:[-0.47,-0.45], re:[0.47,-0.45], lw:[-0.5,0.05], rw:[0.5,0.05], lh:[-0.27,0], rh:[0.27,0], lk:[-0.25,1.02], rk:[0.25,1.02], la:[-0.26,2], ra:[0.26,2]};
const POSES = [
  {sub:'full', id:'relax', name:'稍息站姿', tip:'一只脚在前，重心放在后脚', d:{rk:[0.1,1.0], ra:[0.02,1.97], lk:[-0.22,1.03], la:[-0.3,2], re:[0.52,-0.42], rw:[0.36,0.02]}},
  {sub:'full', id:'walk', name:'走路抓拍', tip:'自然往前走，手臂跟着摆', d:{lk:[-0.2,1.0], la:[-0.4,1.94], rk:[0.2,1.0], ra:[0.38,1.95], le:[-0.5,-0.42], lw:[-0.34,0.06], re:[0.44,-0.46], rw:[0.6,-0.02]}},
  {sub:'full', id:'turn', name:'侧身回头', tip:'身体侧过去，头转回镜头', d:{nose:[0.12,-1.45], ls:[-0.22,-1], rs:[0.22,-1], lh:[-0.15,0], rh:[0.15,0], le:[-0.28,-0.45], lw:[-0.3,0.05], re:[0.26,-0.45], rw:[0.28,0.05], lk:[-0.12,1.02], la:[-0.14,2], rk:[0.14,1.0], ra:[0.22,1.97]}},
  {sub:'half', id:'chin', name:'托腮', tip:'手轻托下巴，别用力压脸', d:{re:[0.3,-0.4], rw:[0.08,-1.25]}},
  {sub:'half', id:'arms', name:'抱臂', tip:'手臂交叉放松，肩膀下沉', d:{le:[-0.42,-0.5], lw:[0.25,-0.55], re:[0.42,-0.5], rw:[-0.25,-0.55]}},
  {sub:'half', id:'hair', name:'撩头发', tip:'手轻碰头发，肩膀放松', d:{re:[0.66,-1.45], rw:[0.2,-1.62]}},
  {sub:'travel', id:'open', name:'张开双臂', tip:'双臂打开，像在拥抱风景', d:{le:[-0.85,-1.15], lw:[-1.25,-1.35], re:[0.85,-1.15], rw:[1.25,-1.35]}},
  {sub:'travel', id:'back', name:'背影远眺', tip:'背对镜头看远处，双手放身后', d:{le:[-0.42,-0.45], lw:[-0.05,-0.05], re:[0.42,-0.45], rw:[0.05,-0.05]}},
  {sub:'travel', id:'look', name:'回眸', tip:'往前走两步再回头看镜头', d:{nose:[0.14,-1.45], ls:[-0.24,-1], rs:[0.24,-1], lh:[-0.16,0], rh:[0.16,0], le:[-0.3,-0.45], lw:[-0.32,0.05], re:[0.3,-0.6], rw:[0.22,-1.0], lk:[-0.12,1.02], la:[-0.16,2], rk:[0.14,1.0], ra:[0.2,1.97]}},
  {sub:'sit', id:'side', name:'侧坐', tip:'腿斜着放，一只手撑地', d:{lk:[-0.75,0.15], la:[-0.85,1.0], rk:[-0.6,0.3], ra:[-0.95,1.05], le:[-0.45,-0.45], lw:[-0.6,0.1], re:[0.55,-0.3], rw:[0.6,0.35]}},
  {sub:'sit', id:'hug', name:'抱膝', tip:'双手抱住膝盖，下巴放在膝盖上', d:{lk:[-0.15,-0.55], la:[-0.25,0.35], rk:[0.15,-0.55], ra:[0.25,0.35], le:[-0.45,-0.6], lw:[0.05,-0.45], re:[0.45,-0.6], rw:[-0.05,-0.45]}},
  {sub:'sit', id:'lean', name:'单手撑地', tip:'腿往一侧伸直，身体稍微后仰', d:{lk:[-0.7,0.2], la:[-1.4,0.4], rk:[-0.6,0.05], ra:[-1.3,0.15], re:[0.55,-0.35], rw:[0.62,0.3], le:[-0.42,-0.45], lw:[-0.5,0.0]}},
  {sub:'selfie', id:'tilt', name:'歪头', tip:'头轻轻歪向一侧，眼睛看镜头', d:{nose:[0.15,-1.42], re:[0.6,-0.85], rw:[0.9,-1.2]}},
  {sub:'selfie', id:'yeah', name:'比耶', tip:'手比耶放在脸旁边', d:{le:[-0.55,-0.75], lw:[-0.35,-1.45], re:[0.6,-0.85], rw:[0.9,-1.2]}},
  {sub:'selfie', id:'profile', name:'侧脸', tip:'脸转 45°，下巴微收', d:{nose:[0.22,-1.45], ls:[-0.3,-1], rs:[0.3,-1], re:[0.5,-0.85], rw:[0.8,-1.2]}},
].map(p => ({...p, k:{...T0, ...p.d}}));
const BONES = [['ls','rs'],['ls','le'],['le','lw'],['rs','re'],['re','rw'],['ls','lh'],['rs','rh'],['lh','rh'],['lh','lk'],['lk','la'],['rh','rk'],['rk','ra']];
const SEGS = [['ls','le','画面左侧的手臂'],['le','lw','画面左侧的手'],['rs','re','画面右侧的手臂'],['re','rw','画面右侧的手'],['lh','lk','画面左侧的腿'],['lk','la','画面左侧的脚'],['rh','rk','画面右侧的腿'],['rk','ra','画面右侧的脚']];

function poseSVG(k){
  const pt = n => `${k[n][0].toFixed(2)},${k[n][1].toFixed(2)}`;
  const lines = BONES.map(([a,b]) => `M${pt(a)}L${pt(b)}`).join('');
  return `<svg viewBox="-1 -1.9 2 4.1" aria-hidden="true"><path d="${lines}" stroke="currentColor" stroke-width="0.13" fill="none" stroke-linecap="round"/><circle cx="${k.nose[0]}" cy="${k.nose[1]}" r="0.26" fill="none" stroke="currentColor" stroke-width="0.13"/></svg>`;
}
function renderPoseBar(){
  const bar = $('#posebar'), list = POSES.filter(p => p.sub === S.sub);
  if(!list.some(p => p.id === S.pose)) S.pose = 'none';
  bar.hidden = list.length === 0;
  const chip = (id, name, svg) => `<button class="chip" id="pose-${id}" data-pose="${id}" aria-pressed="${id === S.pose}">${svg}${name}</button>`;
  bar.innerHTML = '<label>姿势模板</label>' + chip('none', '不用模板', '') + list.map(p => chip(p.id, p.name, poseSVG(p.k))).join('');
}
function initPoseBar(){
  const bar = $('#posebar');
  bar.addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; S.pose = b.dataset.pose; bar.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); S.active.clear(); if(!S.live) renderStill(); });
}

  const sub = S.sub, kind = SUBS[sub].kind;
  const base = {portrait: kind === 'portrait' && !!F.person, scene: kind === 'scene', sub};
  if(!LIB) return {...base, rules: [], display: [], score: '--', tip: null, features: null, errors: []};
  const f = buildFeatures(F);
  const res = runRules(LIB, f, {sub, tipIndex: Math.floor(Date.now()/6000)});
  const display = res.rules.some(r => r.pen > 0) ? res.rules : [OK_RULE, ...res.rules, res.tip].filter(Boolean);
  return {...base, rules: res.rules, display, score: res.score, tip: res.tip, features: f, errors: res.errors};
}

/* ---------- drawing ---------- */
function arrow(ctx, x1, y1, x2, y2, lw, color){
  const a = Math.atan2(y2-y1, x2-x1), hl = lw*4;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw*1.4;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a)*hl*0.6, y2 - Math.sin(a)*hl*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - hl*Math.cos(a-0.45), y2 - hl*Math.sin(a-0.45)); ctx.lineTo(x2 - hl*Math.cos(a+0.45), y2 - hl*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();
}
function drawPill(ctx, text, x, y, bg, W, H, align = 'center'){
  const fs = Math.max(13, Math.round(Math.min(W, H)*0.034)), pad = Math.round(fs*0.6), h = Math.round(fs*1.75);
  ctx.save(); ctx.font = `700 ${fs}px ${FONT}`;
  const w = Math.ceil(ctx.measureText(text).width) + pad*2;
  let x0 = align === 'left' ? x : align === 'right' ? x - w : x - w/2;
  x0 = clamp(x0, fs*0.4, W - w - fs*0.4); const y0 = clamp(y, fs*0.4, H - h - fs*0.4);
  ctx.fillStyle = bg; ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x0, y0, w, h, h/2); else ctx.rect(x0, y0, w, h);
  ctx.fill(); ctx.fillStyle = '#0D1112'; ctx.textBaseline = 'middle'; ctx.fillText(text, x0 + pad, y0 + h/2 + 1);
  ctx.restore();
  return h;
}
function drawOverlay(ctx, F, E, shown){
  const W = F.W, H = F.H, lw = Math.max(2, Math.round(Math.min(W, H)/220)), ph = Math.round(Math.max(13, Math.round(Math.min(W, H)*0.034))*1.75);
  const pills = [];
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = Math.max(1, lw/2);
  ctx.beginPath(); for(const f of [1/3, 2/3]){ ctx.moveTo(W*f, 0); ctx.lineTo(W*f, H); ctx.moveTo(0, H*f); ctx.lineTo(W, H*f); } ctx.stroke();
  // scene guides
  const sub = E.sub, dashT = [lw*3, lw*3];
  ctx.save(); ctx.lineWidth = Math.max(1.5, lw*0.8);
  if(sub === 'city'){
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash(dashT);
    ctx.beginPath(); ctx.moveTo(W*0.12, 0); ctx.lineTo(W*0.12, H); ctx.moveTo(W*0.88, 0); ctx.lineTo(W*0.88, H); ctx.stroke();
    ctx.strokeStyle = C.target; ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.globalAlpha = 1;
  } else if(sub === 'half'){
    ctx.strokeStyle = C.target; ctx.globalAlpha = 0.75; ctx.setLineDash(dashT); ctx.beginPath(); ctx.moveTo(0, H/3); ctx.lineTo(W, H/3); ctx.stroke(); ctx.globalAlpha = 1;
  } else if(sub === 'full'){
    ctx.strokeStyle = C.target; ctx.globalAlpha = 0.75; ctx.setLineDash(dashT); ctx.beginPath(); ctx.moveTo(0, H*0.95); ctx.lineTo(W, H*0.95); ctx.stroke(); ctx.globalAlpha = 1;
  } else if(sub === 'travel'){
    const bx = (F.person && F.person.cx > 0.5 ? 2/3 : 1/3)*W, bh = H/3, bw = bh*0.42;
    ctx.strokeStyle = C.target; ctx.globalAlpha = 0.75; ctx.setLineDash(dashT); ctx.strokeRect(bx - bw/2, H*0.86 - bh, bw, bh); ctx.globalAlpha = 1;
  } else if(sub === 'selfie'){
    const rx = W*0.21, ry = rx*1.32;
    ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.4; ctx.setLineDash([lw*4, lw*3]); ctx.beginPath(); ctx.ellipse(W/2, H*0.38, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
  } else if(sub === 'macro'){
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; const m = Math.min(W, H)*0.04;
    for(const fx of [1/3, 2/3]) for(const fy of [1/3, 2/3]){ const x = W*fx, y = H*fy; ctx.beginPath(); ctx.moveTo(x - m, y); ctx.lineTo(x + m, y); ctx.moveTo(x, y - m); ctx.lineTo(x, y + m); ctx.stroke(); }
  } else if(sub === 'night' && F.shake != null){
    const bw = W*0.4, bx = W*0.3, by = H*0.03, bh = Math.max(6, lw*2.5), v = 1 - Math.min(F.shake/15, 1);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = F.shake <= 6 ? '#7BD88F' : C.now; ctx.fillRect(bx, by, bw*v, bh);
  }
  ctx.restore();
  const P = E.portrait ? F.person : null;
  if(P){
    const g = P.g;
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = lw;
    ctx.beginPath(); for(const [a, b] of BONES){ if(g[a] && g[b]){ ctx.moveTo(g[a][0], g[a][1]); ctx.lineTo(g[b][0], g[b][1]); } } ctx.stroke();
    const pose = POSES.find(p => p.id === S.pose);
    if(pose){
      const t = P.match ? P.match.t : pose.k, at = n => [P.origin[0] + t[n][0]*P.T, P.origin[1] + t[n][1]*P.T];
      ctx.setLineDash([lw*3, lw*2.6]); ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.6;
      ctx.beginPath(); for(const [a, b] of BONES){ const p = at(a), q = at(b); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); }
      const n = at('nose'); ctx.moveTo(n[0] + P.T*0.27, n[1]); ctx.arc(n[0], n[1], P.T*0.27, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  for(const r of shown){
    const d = r.draw; if(!d) continue;
    if(d.type === 'tilt'){
      const cx = W/2, cy = H/2, len = Math.min(W, H)*0.38, right = d.theta > 0, sx = right ? W*0.9 : W*0.1;
      let lineY;
      if(d.src === 'horizon' && F.horizon){
        ctx.setLineDash([lw*4, lw*3]); ctx.strokeStyle = C.now; ctx.lineWidth = lw*1.6;
        ctx.beginPath(); ctx.moveTo(0, F.horizon.bN*H); ctx.lineTo(W, (F.horizon.aN + F.horizon.bN)*H); ctx.stroke(); ctx.setLineDash([]);
        const y = F.horizon.y*H; ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.6; ctx.beginPath(); ctx.moveTo(cx-len, y); ctx.lineTo(cx+len, y); ctx.stroke();
        lineY = (F.horizon.aN*sx/W + F.horizon.bN)*H;
      } else {
        const a = -d.theta*Math.PI/180;
        ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.6; ctx.beginPath(); ctx.moveTo(cx-len, cy); ctx.lineTo(cx+len, cy); ctx.stroke();
        ctx.strokeStyle = C.now; ctx.lineWidth = lw*2.2; ctx.beginPath(); ctx.moveTo(cx - len*Math.cos(a), cy - len*Math.sin(a)); ctx.lineTo(cx + len*Math.cos(a), cy + len*Math.sin(a)); ctx.stroke();
        lineY = cy + (sx - cx)*Math.tan(a);
      }
      arrow(ctx, sx, lineY + H*0.07, sx, lineY + H*0.01, lw, C.now);
      pills.push([`${right ? '右侧' : '左侧'}抬高 ${Math.abs(d.theta).toFixed(1)}°`, sx + (right ? lw*2 : -lw*2), lineY - ph - lw*4, C.now, right ? 'right' : 'left']);
    } else if(d.type === 'hline'){
      ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.8; ctx.beginPath(); ctx.moveTo(0, d.t*H); ctx.lineTo(W, d.t*H); ctx.stroke();
      arrow(ctx, W*0.82, d.y*H, W*0.82, d.t*H, lw, C.now);
      pills.push([d.t > d.y ? '手机往上仰' : '手机往下压', W*0.82 - lw*4, (d.y + d.t)/2*H - ph/2, C.now, 'right']);
      pills.push(['地平线放这里', 0, d.t*H + lw*3, C.target, 'left']);
    } else if(d.type === 'move'){
      const x = d.x*W, y = d.y*H, tx = d.tx*W;
      ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.8; ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx, H); ctx.stroke();
      ctx.fillStyle = C.now; ctx.beginPath(); ctx.arc(x, y, lw*3.2, 0, Math.PI*2); ctx.fill();
      arrow(ctx, x, y, tx + Math.sign(x - tx)*lw*2, y, lw, C.now);
      pills.push([tx > x ? '← 手机向左移' : '手机向右移 →', W/2, H*0.1, C.now, 'center']);
      pills.push(['人站到这条线', tx, H*0.6, C.target, 'center']);
    } else if(d.type === 'band'){
      ctx.fillStyle = C.warn; ctx.globalAlpha = 0.55; ctx.fillRect(0, 0, W, Math.max(lw*3, H*0.02)); ctx.globalAlpha = 1;
      pills.push(['头顶要留空', W/2, H*0.03, C.warn, 'center']);
    } else if(d.type === 'headroom'){
      ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.6; ctx.beginPath(); ctx.moveTo(W*0.25, H*0.1); ctx.lineTo(W*0.75, H*0.1); ctx.stroke();
      arrow(ctx, W/2, d.y*H, W/2, H*0.1 + lw*3, lw, C.now);
      pills.push(['头顶到这里', W*0.75 + lw*3, H*0.1 - ph/2, C.target, 'left']);
    } else if(d.type === 'cut'){
      ctx.strokeStyle = C.warn; ctx.lineWidth = lw*1.8; ctx.setLineDash([lw*3, lw*2]); ctx.beginPath(); ctx.moveTo(0, d.y*H); ctx.lineTo(W, d.y*H); ctx.stroke(); ctx.setLineDash([]);
      pills.push([d.label || '注意截断位置', 0, d.y*H - ph - lw*3, C.warn, 'left']);
    } else if(d.type === 'box'){
      const [bx, by, bw, bh] = d.r;
      ctx.strokeStyle = C.warn; ctx.lineWidth = lw*1.8; ctx.strokeRect(bx, by, bw, bh);
      pills.push(['脸太暗', bx + bw + lw*3, by, C.warn, 'left']);
      const ax = bx + bw/2, ay = by + bh*3.2, R = bw*1.7;
      ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.8; ctx.beginPath(); ctx.arc(ax, ay, R, Math.PI*0.12, Math.PI*0.86); ctx.stroke();
      const e1 = Math.PI*0.8, e2 = Math.PI*0.88;
      arrow(ctx, ax + R*Math.cos(e1), ay + R*Math.sin(e1), ax + R*Math.cos(e2), ay + R*Math.sin(e2), lw, C.target);
      pills.push(['一起转身 45°', ax, ay + R + lw*3, C.target, 'center']);
    } else if(d.type === 'zone'){
      ctx.strokeStyle = C.warn; ctx.lineWidth = lw*1.8; ctx.setLineDash([lw*3, lw*2]); ctx.strokeRect(d.x*W, d.y*H, d.w*W, d.h*H); ctx.setLineDash([]);
      pills.push([d.label || '注意这里', d.x*W + d.w*W + lw*3, d.y*H, C.warn, 'left']);
    } else if(d.type === 'arrow2'){
      const x = d.x*W, y = d.y*H, tx = d.tx*W, ty = d.ty*H, R = Math.min(W, H)*0.06;
      ctx.strokeStyle = C.target; ctx.lineWidth = lw*1.8; ctx.beginPath(); ctx.arc(tx, ty, R, 0, Math.PI*2); ctx.stroke();
      const a = Math.atan2(ty - y, tx - x);
      arrow(ctx, x, y, tx - Math.cos(a)*R, ty - Math.sin(a)*R, lw, C.now);
      pills.push([d.label, tx, ty + R + lw*3, C.target, 'center']);
    } else if(d.type === 'guideH'){
      const col = d.color === 'warn' ? C.warn : C.target;
      ctx.strokeStyle = col; ctx.lineWidth = lw*1.8; ctx.beginPath(); ctx.moveTo(0, d.y*H); ctx.lineTo(W, d.y*H); ctx.stroke();
      if(d.from != null) arrow(ctx, W*0.82, d.from*H, W*0.82, d.y*H, lw, C.now);
      pills.push([d.label, lw*2, d.y*H + (d.y > 0.85 ? -ph - lw*3 : lw*3), col, 'left']);
    } else if(d.type === 'keystone'){
      const up = d.ks > 0, inset = W*0.08;
      ctx.strokeStyle = C.now; ctx.lineWidth = lw*1.8; ctx.setLineDash([lw*3, lw*2.5]);
      ctx.beginPath();
      if(up){ ctx.moveTo(W*0.12, H*0.9); ctx.lineTo(W*0.12 + inset, H*0.1); ctx.moveTo(W*0.88, H*0.9); ctx.lineTo(W*0.88 - inset, H*0.1); }
      else { ctx.moveTo(W*0.12 + inset, H*0.9); ctx.lineTo(W*0.12, H*0.1); ctx.moveTo(W*0.88 - inset, H*0.9); ctx.lineTo(W*0.88, H*0.1); }
      ctx.stroke(); ctx.setLineDash([]);
      pills.push([up ? '手机竖直，别仰拍' : '手机平视，别俯拍', W/2, H*0.12, C.now, 'center']);
      pills.push(['竖线要和白线平行', W/2, H*0.2, C.target, 'center']);
    } else if(d.type === 'sym'){
      const cx = d.c*W;
      ctx.strokeStyle = C.now; ctx.lineWidth = lw*1.8; ctx.setLineDash([lw*3, lw*2.5]); ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke(); ctx.setLineDash([]);
      arrow(ctx, cx, H*0.5, W/2 + Math.sign(cx - W/2)*lw*2, H*0.5, lw, C.now);
      pills.push(['对准中轴线', W/2, H*0.56, C.target, 'center']);
    } else if(d.type === 'topband'){
      ctx.fillStyle = C.warn; ctx.globalAlpha = 0.55; ctx.fillRect(0, 0, W, Math.max(lw*3, H*0.02)); ctx.globalAlpha = 1;
      pills.push(['楼顶被切了，后退几步', W/2, H*0.03, C.warn, 'center']);
    } else if(d.type === 'sizebox'){
      pills.push(['人这么大就好', (d.x > 0.5 ? 2/3 : 1/3)*W, H*0.86 + lw*3, C.target, 'center']);
    } else if(d.type === 'oval'){
      pills.push(['脸放进框里', W/2, H*0.38 + W*0.21*1.32 + lw*3, C.target, 'center']);
    } else if(d.type === 'shakepill'){
      pills.push(['拿稳，绿了再拍', W/2, H*0.03 + lw*5, C.now, 'center']);
    } else if(d.type === 'pose'){
      ctx.fillStyle = C.now; ctx.beginPath(); ctx.arc(d.pt[0], d.pt[1], lw*3, 0, Math.PI*2); ctx.fill();
      pills.push([d.short, d.pt[0] + lw*5, d.pt[1] - ph/2, C.now, 'left']);
    }
  }
  for(const p of pills) drawPill(ctx, p[0], p[1], p[2], p[3], W, H, p[4]);
  ctx.restore();
}

    if(caps.exposureCompensation){
      const want = show ? Math.min(caps.exposureCompensation.max, 1) : 0;
      if(S.expComp !== want){ S.expComp = want; tr.applyConstraints({advanced: [{exposureCompensation: want}]}).catch(() => {}); }
    }
  }
}
function useSystemCamera(){
  if(S.live) stopLive();
  toast('正在打开系统相机。拍完会自动回来点评；想用小米相机的「夜景」模式，可以先在相机里拍好，再点「相册」导入。');
  $('#fileCam').click();
}

/* ---------- photo review ---------- */
function loadImage(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; }); }
async function handleFile(file, fromAlbum){
  if(!file) return;
  try {
    const im = await loadImage(file), s = Math.min(1, 1600/Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth*s); c.height = Math.round(im.naturalHeight*s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    await showResult(c, {file, fromAlbum});
  } catch(e){ toast('这张图片打不开，换一张试试'); }
}

/* ---------- validation: feedback + hit details ---------- */
const FB_KEY = 'ss_fb_v1', FBLOG_KEY = 'ss_fblog_v1';
function readJSON(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } }
function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function compactFeatures(f){ const o = {}; if(!f) return o; for(const k in f){ const v = f[k]; if(typeof v === 'number') o[k] = Math.round(v*1000)/1000; else if(typeof v === 'boolean') o[k] = v; } return o; }
function recordFeedback(id, v, ctx){
  const all = readJSON(FB_KEY, {}); const e = all[id] || {up: 0, down: 0}; e[v] = (e[v] || 0) + 1; all[id] = e; writeJSON(FB_KEY, all);
  const log = readJSON(FBLOG_KEY, []); log.push({id, v, sub: ctx.sub, score: ctx.score, t: new Date().toISOString(), f: compactFeatures(ctx.f)}); writeJSON(FBLOG_KEY, log.slice(-300));
}
function hintFbHTML(r){
  const fb = r.kind === 'detect' ? `<div class="fb"><button class="fbb" data-fb="up" data-rule="${r.id}" aria-pressed="false">有用</button><button class="fbb" data-fb="down" data-rule="${r.id}" aria-pressed="false">不准</button></div>` : '';
  return `<div class="hint-wrap">${hintHTML(r)}${fb}</div>`;
}
function debugHTML(E){
  if(!LIB) return '';
  const fired = E.rules.length ? E.rules.map(r => `<li><b>${r.id}</b> ${r.title}（扣 ${r.pen} 分）${r.principle ? `<br><span>${r.principle}</span>` : ''}</li>`).join('') : '<li>没有规则命中</li>';
  const f = compactFeatures(E.features);
  const feats = Object.keys(f).map(k => `<span>${k}</span><span>${f[k]}</span>`).join('');
  const errs = E.errors.length ? `<p class="note" style="color:var(--warn)">规则执行出错：${E.errors.join('；')}</p>` : '';
  return `<details class="dbg"><summary>规则命中详情（验证用）</summary>
    <p class="note">规则库 v${LIB.version} · 检测规则 ${LIB.count.detect} 条 · 场景技巧 ${LIB.count.tip} 条 · 当前场景：${SUBS[E.sub].name}</p>
    <ol>${fired}</ol>${errs}
    <p class="note">画面特征值</p><div class="feat">${feats}</div>
    <a class="btn ghost" href="./rules.html">查看完整规则库和反馈统计</a>
  </details>`;
}

/* ---------- saving to the phone ---------- */
function stamp(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function downloadURL(url, name){ const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function savePhoto(){
  const cur = S.current; if(!cur) return;
  const name = `随手大师_${stamp()}.jpg`;
  if(cur.file){ const u = URL.createObjectURL(cur.file); downloadURL(u, name); setTimeout(() => URL.revokeObjectURL(u), 10000); }
  else downloadURL(cur.c.toDataURL('image/jpeg', 0.95), name);
  cur.saved = true;
  const b = $('#savePhoto'); if(b){ b.textContent = '已保存到相册'; b.classList.add('ghost'); }
  toast('照片已保存到手机「下载」文件夹，打开相册就能看到');
}
let pendingLeave = null;
function requestLeave(next){
  if(!S.current || S.current.saved){ next(); return; }
  pendingLeave = next; $('#confirm').hidden = false;
}
function hideConfirm(){ $('#confirm').hidden = true; }
function suggestCrop(c, F, E){
  const W = c.width, H = c.height, tilt = E.rules.find(r => r.id === 'tilt');
  const ang = tilt && tilt.draw.src === 'horizon' ? F.horizon.angle : 0, rad = -ang*Math.PI/180;
  const k = Math.abs(Math.cos(rad)) + Math.abs(Math.sin(rad))*Math.max(W/H, H/W), tr = v => (v - 0.5)*k + 0.5;
  const z = 0.82, cw = W*z, ch = H*z, P = E.portrait ? F.person : null;
  let cx = (W - cw)/2, cy = (H - ch)/2, need = ang !== 0;
  if(P){
    const t = P.cx < 0.5 ? 1/3 : 2/3;
    if(Math.abs(P.cx - 0.5) > 0.05 && Math.abs(t - P.cx) > 0.04){ cx = tr(P.cx)*W - t*cw; need = true; }
    if(P.headTop > 0.22){ cy = tr(P.headTop)*H - 0.1*ch; need = true; }
  } else if(E.scene && F.horizon && F.horizon.y > 0.4 && F.horizon.y < 0.6){
    const t = (F.horizon.skySd || 0) > 16 ? 2/3 : 1/3; cy = tr(F.horizon.y)*H - t*ch; need = true;
  }
  if(!need) return null;
  cx = clamp(cx, 0, W - cw); cy = clamp(cy, 0, H - ch);
  const r = document.createElement('canvas'); r.width = W; r.height = H;
  const g = r.getContext('2d'); g.translate(W/2, H/2); g.rotate(rad); g.scale(k, k); g.drawImage(c, -W/2, -H/2);
  const out = document.createElement('canvas'); out.width = Math.round(cw); out.height = Math.round(ch);
  out.getContext('2d').drawImage(r, cx, cy, cw, ch, 0, 0, out.width, out.height);
  return out;
}
function makeCard(a, b, s1, s2, la, lb){
  const cw = 1080, pad = 48, gap = 24, col = (cw - pad*2 - gap)/2;
  const ha = col*a.height/a.width, hb = col*b.height/b.width, ih = Math.max(ha, hb), H = Math.round(pad + 96 + ih + 150);
  const c = document.createElement('canvas'); c.width = cw; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#0D1112'; g.fillRect(0, 0, cw, H);
  g.fillStyle = '#EEF2F1'; g.font = `700 46px ${FONT}`; g.fillText('跟着提示，再拍一张', pad, pad + 46);
  g.drawImage(a, pad, pad + 96, col, ha); g.drawImage(b, pad + col + gap, pad + 96, col, hb);
  const ly = pad + 96 + ih + 56;
  g.font = `500 30px ${FONT}`; g.fillStyle = '#95A29F'; g.fillText(la, pad, ly); g.fillText(lb, pad + col + gap, ly);
  g.font = `600 44px "Barlow Condensed",${FONT}`; g.fillStyle = '#F3A443'; g.fillText(s1 + ' 分', pad + col - 110, ly + 2); g.fillStyle = '#4FD6B8'; g.fillText(s2 + ' 分', pad + col*2 + gap - 110, ly + 2);
  g.font = `400 26px ${FONT}`; g.fillStyle = '#95A29F'; g.fillText('随手大师 · 拍照教练', pad, H - 36);
  return c.toDataURL('image/jpeg', 0.9);
}
function showCard(url){
  $('#cardOut').innerHTML = `<img src="${url}" alt="对比分享卡"><div class="row"><button class="btn ghost" id="saveCard">保存对比卡</button></div><p class="note">保存后可以发朋友圈或小红书，也可以长按图片保存。</p>`;
  $('#saveCard').onclick = () => { downloadURL(url, `随手大师_对比卡_${stamp()}.jpg`); toast('对比卡已保存到手机「下载」文件夹'); };
}
async function showResult(c, opts = {}){
  S.current = {c, file: opts.file || null, saved: !!opts.fromAlbum};
  S.sheetOpen = true; $('#sheet').hidden = false; $('#sheet').scrollTop = 0;
  const body = $('#resBody'); body.innerHTML = '<p class="note">正在点评…</p>';
  const F = await analyze(c, c.width, c.height); applyRecommendation(F, false); const E = evaluate(F);
  const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
  const og = o.getContext('2d'); og.drawImage(c, 0, 0); drawOverlay(og, F, E, E.rules);
  const crop = suggestCrop(c, F, E); let E2 = null;
  if(crop){ const F2 = await analyze(crop, crop.width, crop.height); E2 = evaluate(F2); }
  const prev = S.prev;
  body.innerHTML = `
    <div class="res-score"><b>${E.score}</b><span>构图分</span></div>
    <div id="resImg"></div>
    <div class="row">${S.current.saved ? '<button class="btn ghost" id="savePhoto">这张来自相册，已保存</button>' : '<button class="btn" id="savePhoto">保存到相册</button>'}</div>
    <h3>怎么改</h3>
    <div class="list">${E.display.length ? E.display.map(hintFbHTML).join('') : OK_HINT}</div>
    ${debugHTML(E)}
    ${opts.single ? `<h3>夜景合成效果</h3><p class="note">连拍 12 帧对齐叠加，噪点更少、暗部更亮。</p><div class="compare"><figure><img id="imgSingle" alt="单帧"><figcaption>单帧</figcaption></figure><figure><img id="imgNight" alt="夜景合成"><figcaption>夜景合成</figcaption></figure></div>` : ''}
    ${crop ? `<h3>建议构图</h3><p class="note">自动摆正并按三分线裁剪后的效果，下一张照着这个拍。</p>
      <div class="compare"><figure><img id="imgOrig" alt="原图"><figcaption>原图<b>${E.score}</b></figcaption></figure><figure><img id="imgCrop" alt="建议构图"><figcaption>建议<b>${E2.score}</b></figcaption></figure></div>` : ''}
    <div class="row">
      ${crop ? '<button class="btn ghost" id="saveCrop">保存建议构图</button><button class="btn ghost" id="mkCrop">生成建议对比卡</button>' : ''}
      ${prev ? '<button class="btn ghost" id="mkPrev">和上一张做对比卡</button>' : ''}
    </div>
    <div id="cardOut"></div>
    <button class="btn ghost" id="again">按提示再拍一张</button>`;
  $('#resImg').appendChild(o);
  body.querySelectorAll('.fbb').forEach(b => b.onclick = () => {
    recordFeedback(b.dataset.rule, b.dataset.fb, {sub: E.sub, score: E.score, f: E.features});
    b.parentElement.querySelectorAll('.fbb').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    toast(b.dataset.fb === 'up' ? '已记录：这条提示有用' : '已记录：这条提示不准，我们会调整');
  });
  if(!S.current.saved) $('#savePhoto').onclick = savePhoto;
  if(opts.single){ $('#imgSingle').src = opts.single.toDataURL('image/jpeg', 0.85); $('#imgNight').src = c.toDataURL('image/jpeg', 0.85); }
  if(crop){
    $('#imgOrig').src = c.toDataURL('image/jpeg', 0.85); $('#imgCrop').src = crop.toDataURL('image/jpeg', 0.85);
    $('#mkCrop').onclick = () => showCard(makeCard(c, crop, E.score, E2.score, '原图', '建议构图'));
    $('#saveCrop').onclick = () => { downloadURL(crop.toDataURL('image/jpeg', 0.95), `随手大师_建议构图_${stamp()}.jpg`); toast('建议构图已保存到手机「下载」文件夹'); };
  }
  if(prev) $('#mkPrev').onclick = () => showCard(makeCard(prev.c, c, prev.score, E.score, '调整前', '调整后'));
  $('#again').onclick = () => requestLeave(() => { closeSheet(); if(!S.live) $('#fileCam').click(); });
  S.prev = {c, score: E.score}; S.still = c; S.isSample = false;
}
function closeSheet(){ S.sheetOpen = false; $('#sheet').hidden = true; if(!S.live) renderStill(); }

/* ---------- UI wiring ---------- */
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200); }
function setMode(m){
  S.mode = m; S.subManual = false;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false'));
  if(m !== 'auto' && SUBS[S.sub].kind !== m){ const first = m === 'portrait' && S.facing === 'user' ? 'selfie' : SUB_ORDER[m][0]; S.rec = first; setSub(first, false); }
  S.active.clear(); if(!S.live) renderStill();
}
document.querySelector('.seg').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setMode(b.dataset.mode); });
$('#btnShutter').addEventListener('click', () => { if(S.nightBusy) return; if(nightActive()) nightCapture(); else if(S.live) showResult(grabFrame()); else $('#fileCam').click(); });
$('#btnNight').addEventListener('click', () => { S.nightOn = !S.nightOn; updateNightUI(); toast(S.nightOn ? '夜景合成已开启：按快门后保持 2 秒不动' : '夜景合成已关闭'); });
$('#btnSys').addEventListener('click', useSystemCamera);
$('#btnAlbum').addEventListener('click', () => $('#fileAlbum').click());
$('#btnLive').addEventListener('click', () => { if(S.live) stopLive(); else startLive(); });
$('#btnFlip').addEventListener('click', flipCamera);
$('#fileCam').addEventListener('change', e => { handleFile(e.target.files[0], false); e.target.value = ''; });
$('#fileAlbum').addEventListener('change', e => { handleFile(e.target.files[0], true); e.target.value = ''; });
$('#closeSheet').addEventListener('click', () => requestLeave(closeSheet));
$('#cfSave').addEventListener('click', () => { savePhoto(); hideConfirm(); const n = pendingLeave; pendingLeave = null; if(n) n(); });
$('#cfDiscard').addEventListener('click', () => { if(S.current) S.current.saved = true; hideConfirm(); const n = pendingLeave; pendingLeave = null; if(n) n(); });
$('#cfCancel').addEventListener('click', () => { pendingLeave = null; hideConfirm(); });

initPoseBar(); initSceneBar(); renderSceneBar(); renderPoseBar(); loadRules();
S.still = drawSample();
renderStill();

(async () => {
  try {
    const mod = await import('./human.esm.js');
    const Human = mod.Human || mod.default;
    const h = new Human({
      backend: 'webgl', modelBasePath: './models/', debug: false, warmup: 'none', cacheSensitivity: 0,
      filter: {enabled: false}, face: {enabled: false}, hand: {enabled: false}, object: {enabled: false}, gesture: {enabled: false}, segmentation: {enabled: false},
      body: {enabled: true, modelPath: 'movenet-lightning.json', minConfidence: 0.2, maxDetected: 1},
    });
    await h.load();
    S.human = h;
    $('#status').textContent = '人像识别已就绪 · 照片只在手机本地分析，不上传';
  } catch(e){
    $('#status').textContent = '人像识别没加载成功，构图、水平和光线提示仍可用';
  }
})();
</script>
